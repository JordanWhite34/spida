name: Check

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: game.js is built from src/
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm test
