<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101922">
  <title>Skyline Swing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="game" aria-label="First-person city swinging game"></canvas>

    <div id="speed-blur" class="speed-blur" aria-hidden="true"><div></div><div></div></div>
    <div class="screen-shade" aria-hidden="true"></div>
    <canvas id="minimap" width="320" height="320" aria-label="City minimap showing your position, landmarks, and Rhino"></canvas>
    <div class="reticle" aria-hidden="true"><span></span></div>
    <div id="blast-flash" aria-hidden="true"></div>
    <div id="blast-wind" aria-hidden="true"></div>
    <div id="blast-blackout" aria-hidden="true"></div>
    <button id="nuke" class="nuke-button" aria-label="Launch nuke" title="Launch nuke">&#9762;</button>

    <div class="mobile-controls" aria-label="Touch controls">
      <div class="mobile-move"><button id="forward" aria-label="Move forward">&#8593;</button><div><button id="left" aria-label="Move left">&#8592;</button><button id="back" aria-label="Move backward">&#8595;</button><button id="right" aria-label="Move right">&#8594;</button></div></div>
      <div class="mobile-actions"><button id="sprint" aria-label="Hold to sprint">&#187;</button><button id="jump" aria-label="Jump">&#8613;</button><button id="zip" aria-label="Web zip">&#10148;</button><button id="bomb" aria-label="Shoot a web bomb">&#10041;</button><button id="swing" aria-label="Hold to swing">&#9673;</button></div>
    </div>
    <div id="error" class="error" hidden>Couldn&rsquo;t load the 3D engine. Check your internet connection and reload.</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="arms-model.js"></script>
  <script src="billboard-image.js"></script>
  <script src="game.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
  <script type="module" src="featured-model.js"></script>
</body>
</html>
